name = "news-update"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["0 23,5,11 * * *"] # 06:00, 12:00, 18:00 WIB

[vars]
NIM_MODEL = "meta/llama-3.3-70b-instruct"
PER_FEED = "5"
PER_CATEGORY = "4"

[[kv_namespaces]]
binding = "SEEN"
id = "PASTE_KV_ID" # ganti dgn output: npx wrangler kv namespace create SEEN
